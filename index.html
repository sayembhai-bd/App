<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030407">
  <meta name="referrer" content="no-referrer">
  <title>HACKING BOT BD • </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --a: #ff0033;
      --ad: rgba(255, 0, 51, 0.12);
      --ab: rgba(255, 0, 51, 0.38);
      --brda: rgba(255, 0, 51, 0.35);
      --bg: #030407;
      --card-bg: rgba(9, 11, 20, 0.78);
      --txt: #eef0f8;
      --muted: #9598b3;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --green: #34d399;
      --tg: #229ED9;
      --wa: #25D366;
    }

    html { font-size: 15px; scroll-behavior: smooth; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      padding: 20px 14px 100px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(circle 700px at 50% -10%, var(--ad) 0%, transparent 70%),
        radial-gradient(circle 500px at 85% 80%, rgba(255,0,51,0.05) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
      transform: translateZ(0);
    }

    body::after {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,0,51,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,0,51,0.02) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none; z-index: 0;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, black 40%, transparent 100%);
      transform: translateZ(0);
    }

    .wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 460px; margin: 0 auto;
    }

    /* ============================================
       PROFILE HEADER
    ============================================ */
    .profile-card {
      position: relative;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 16px 40px -12px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
      animation: fadeUp 0.45s var(--ease);
    }

    .profile-card::before {
      content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--ab) 50%, transparent);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar-wrap {
      position: relative;
      width: 52px; height: 52px;
      flex-shrink: 0;
    }

    .avatar-wrap::before {
      content: '';
      position: absolute; inset: -2px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg, var(--a) 90deg,
        transparent 180deg, var(--a) 270deg,
        transparent 360deg
      );
      animation: spinRing 4s linear infinite;
      opacity: 0.85;
      will-change: transform;
    }

    @keyframes spinRing { to { transform: rotate(360deg); } }

    .avatar-inner {
      position: absolute; inset: 0;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--bg);
      background: #070810;
      box-shadow: 0 0 18px rgba(255,0,51,0.4);
    }

    .avatar-inner img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .online-dot {
      position: absolute;
      bottom: -1px; right: -1px;
      width: 15px; height: 15px;
      border-radius: 50%;
      background: var(--green);
      border: 2.5px solid var(--bg);
      box-shadow: 0 0 10px var(--green);
      z-index: 3;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-family: 'Orbitron', monospace;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: #fff;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-username {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      color: var(--a);
      letter-spacing: 0.04em;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-username i {
      font-size: 0.75rem;
      margin-right: 2px;
      vertical-align: middle;
    }

    .tg-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--tg) 0%, #0088cc 100%);
      border: 1.5px solid rgba(34,158,217,0.55);
      color: #fff;
      text-decoration: none;
      box-shadow:
        0 0 18px rgba(34,158,217,0.45),
        inset 0 1px 0 rgba(255,255,255,0.3);
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .tg-circle i { font-size: 1.35rem; }

    .tg-circle:hover {
      transform: translateY(-1px) scale(1.05);
      box-shadow: 0 0 28px rgba(34,158,217,0.75);
    }

    .tg-circle:active { transform: scale(0.94); }

    .profile-bio {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ============================================
       SEARCH BAR
    ============================================ */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
      animation: fadeUp 0.5s var(--ease);
    }

    .search-wrap .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 42px 12px 40px;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: border-color 0.25s, box-shadow 0.25s;
      -webkit-appearance: none;
    }

    .search-wrap input::placeholder {
      color: rgba(149,152,179,0.6);
      font-weight: 500;
    }

    .search-wrap input:focus {
      border-color: var(--brda);
      box-shadow: 0 0 0 3px var(--ad), 0 0 18px var(--ad);
    }

    .search-wrap input:focus ~ .search-icon {
      color: var(--a);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.08);
      color: var(--muted);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s, color 0.2s;
    }

    .search-clear.show { display: flex; }
    .search-clear:hover { background: rgba(255,0,51,0.2); color: #fff; }

    /* ============================================
       CARD
    ============================================ */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 16px 14px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 16px 40px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.45s var(--ease);
      margin-bottom: 14px;
    }

    .card::before {
      content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--ab) 50%, transparent);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #fff;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .card-title i { color: var(--a); font-size: 0.95rem; }

    .card-title .count-badge {
      margin-left: auto;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      font-weight: 400;
      color: var(--muted);
    }

    .card-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    /* ============================================
       APP CARDS
    ============================================ */
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      background: linear-gradient(135deg, rgba(255,0,51,0.05) 0%, rgba(255,255,255,0.02) 60%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      overflow: hidden;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
      contain: layout style;
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: 0; left: 8%; right: 8%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ab) 50%, transparent);
    }

    .app-card:hover {
      border-color: var(--brda);
      box-shadow: 0 12px 30px -8px rgba(0,0,0,0.6), 0 0 24px -6px var(--ad);
    }

    .app-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .app-icon-wrap {
      position: relative;
      width: 66px; height: 66px;
      flex-shrink: 0;
    }

    .app-icon-wrap::before {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 20px;
      background: radial-gradient(circle, var(--ab) 0%, transparent 70%);
      opacity: 0.55;
      filter: blur(4px);
      z-index: 0;
    }

    .app-icon-wrap img {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      border-radius: 16px;
      object-fit: cover;
      border: 1.5px solid rgba(255,0,51,0.4);
      background: rgba(255,0,51,0.1);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }

    .app-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .app-name {
      font-family: 'Orbitron', monospace;
      font-size: 0.82rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.02em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .app-specs span {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.54rem;
      color: var(--muted);
      padding: 2.5px 7px;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .app-specs span.hl {
      color: var(--a);
      border-color: var(--brda);
      background: var(--ad);
    }

    .app-specs span.lock {
      color: #ffcc00;
      border-color: rgba(255,204,0,0.3);
      background: rgba(255,204,0,0.08);
    }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--a) 0%, #b30024 100%);
      border: 1px solid rgba(255,0,51,0.75);
      border-radius: 12px;
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 20px var(--ab), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      touch-action: manipulation;
      text-decoration: none;
    }

    .dl-btn i { font-size: 0.95rem; }

    .dl-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 32px var(--ab), inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .dl-btn:active { transform: scale(0.96); }

    .dl-btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .dl-btn.loading i {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================
       PASSWORD PANEL
    ============================================ */
    .pwd-panel {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.4s var(--ease), opacity 0.3s var(--ease), margin-top 0.3s var(--ease);
      margin-top: 0;
    }

    .pwd-panel.open {
      max-height: 360px;
      opacity: 1;
      margin-top: 2px;
    }

    .pwd-inner {
      padding: 12px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pwd-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pwd-label i { color: #ffcc00; font-size: 0.8rem; }

    .pwd-input-row {
      display: flex;
      gap: 7px;
    }

    .pwd-input-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .pwd-input-wrap i {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,204,0,0.6);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .pwd-input-wrap input {
      width: 100%;
      padding: 10px 12px 10px 34px;
      background: rgba(10,12,22,0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .pwd-input-wrap input:focus {
      border-color: #ffcc00;
      box-shadow: 0 0 0 3px rgba(255,204,0,0.12), 0 0 14px rgba(255,204,0,0.2);
    }

    .pwd-input-wrap input::placeholder {
      color: rgba(149,152,179,0.5);
      font-weight: 500;
    }

    .pwd-submit {
      padding: 10px 14px;
      background: linear-gradient(135deg, #ffcc00 0%, #d4a000 100%);
      border: 1px solid rgba(255,204,0,0.7);
      border-radius: 10px;
      color: #1a1200;
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 0 18px rgba(255,204,0,0.35);
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .pwd-submit:hover { box-shadow: 0 0 28px rgba(255,204,0,0.6); }
    .pwd-submit:active { transform: scale(0.96); }
    .pwd-submit i { font-size: 0.9rem; }

    .pwd-help {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      background: rgba(37,211,102,0.08);
      border: 1px solid rgba(37,211,102,0.25);
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s, border-color 0.2s, transform 0.2s var(--ease);
      cursor: pointer;
    }

    .pwd-help:hover {
      background: rgba(37,211,102,0.15);
      border-color: rgba(37,211,102,0.5);
      transform: translateY(-1px);
    }

    .pwd-help:active { transform: scale(0.98); }

    .pwd-help .wa-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--wa) 0%, #128C7E 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(37,211,102,0.4);
    }

    .pwd-help .wa-text {
      flex: 1;
      min-width: 0;
    }

    .pwd-help .wa-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem;
      font-weight: 700;
      color: #25D366;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .pwd-help .wa-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.56rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .pwd-help .wa-arrow {
      color: var(--wa);
      font-size: 0.9rem;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .pwd-error {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: rgba(255,0,51,0.12);
      border: 1px solid var(--brda);
      border-radius: 9px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      color: #ff7788;
      animation: shake 0.4s var(--ease);
    }

    .pwd-error.show { display: flex; }
    .pwd-error i { font-size: 0.85rem; flex-shrink: 0; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .pwd-success {
      display: none;
      align-items: center;
      gap: 7px;
      padding: 9px 11px;
      background: rgba(52,211,153,0.12);
      border: 1px solid rgba(52,211,153,0.3);
      border-radius: 9px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.66rem;
      color: var(--green);
    }
    .pwd-success.show { display: flex; }
    .pwd-success i { font-size: 0.95rem; }

    .dl-unlocked {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
      border: 1px solid rgba(52,211,153,0.7);
      border-radius: 12px;
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-decoration: none;
      box-shadow: 0 0 24px rgba(52,211,153,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      touch-action: manipulation;
      cursor: pointer;
    }
    .dl-unlocked.show { display: flex; }
    .dl-unlocked:hover { box-shadow: 0 0 36px rgba(52,211,153,0.6); }
    .dl-unlocked:active { transform: scale(0.97); }
    .dl-unlocked i { font-size: 1rem; }
    .dl-unlocked.loading { opacity: 0.7; pointer-events: none; }
    .dl-unlocked.loading i { animation: spin 0.8s linear infinite; }

    /* Empty / no results */
    .empty-list {
      text-align: center;
      padding: 30px 16px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 14px;
    }

    .empty-list i {
      display: block;
      font-size: 2.2rem;
      color: rgba(255,0,51,0.4);
      margin-bottom: 10px;
    }

    .skeleton {
      height: 100px;
      border-radius: 18px;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0.03) 25%,
        rgba(255,255,255,0.06) 50%,
        rgba(255,255,255,0.03) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer { to { background-position: -200% 0; } }

    /* AD */
    .ad-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.48rem;
      color: rgba(255,255,255,0.22);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 8px;
      display: block;
    }

    .ad-card {
      display: flex;
      align-items: center;
      gap: 11px;

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYZeQsbcbNwKztZIbtx9f0R_nfjZSX01k",
      authDomain: "bdhack-54132.firebaseapp.com",
      databaseURL: "https://bdhack-54132-default-rtdb.firebaseio.com",
      projectId: "bdhack-54132",
      storageBucket: "bdhack-54132.firebasestorage.app",
      messagingSenderId: "767198925219",
      appId: "1:767198925219:web:a520f9a52c4146f1720a16",
      measurementId: "G-TEFJ37XQ33"
    };

    const DEFAULT_WA = '8801349237301';

    const $ = (id) => document.getElementById(id);
    let db;
    let appsCache = {};
    let appConfigCache = {};
    let lastAppsHash = '';
    let lastAdHash = '';
    let lastProfileHash = '';
    let searchQuery = '';
    let filteredIds = [];

    /* ============================================
       HELPERS
    ============================================ */
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function toast(msg, type = 'ok') {
      const box = $('toastBox');
      const t = document.createElement('div');
      t.className = 'toast-item ' + (type === 'ok' ? 'ok' : '');
      const icon = type === 'ok' ? 'ti-circle-check' : 'ti-alert-circle';
      t.innerHTML = `<i class="ti ${icon}"></i><span>${msg}</span>`;
      box.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 400);
      }, 2800);
    }

    function getWhatsAppNumber() {
      return (appConfigCache.whatsapp || DEFAULT_WA).replace(/[^0-9]/g, '');
    }

    function buildWaLink(msg) {
      const num = getWhatsAppNumber();
      return `https://wa.me/${num}?text=${encodeURIComponent(msg || 'Hello, I need the password for an app on your website.')}`;
    }

    /* ============================================
       DIRECT DOWNLOAD (no redirect, no new tab)
    ============================================ */
    function triggerDirectDownload(url, fileNameHint, btn) {
      if (!url) {
        toast('Download link not available', 'err');
        return;
      }

      // Show loading state on button
      let originalHtml = '';
      if (btn) {
        originalHtml = btn.innerHTML;
        btn.classList.add('loading');
        btn.innerHTML = '<i class="ti ti-loader-2"></i> ' + (fileNameHint ? 'Starting...' : 'Wait...');
      }

      try {
        // Method 1: Use a hidden anchor with download attribute (works for same-origin or CORS-enabled)
        const a = document.createElement('a');
        a.href = url;
        // Try to extract filename from URL
        let fname = 'app.apk';
        try {
          const urlObj = new URL(url);
          const last = urlObj.pathname.split('/').pop();
          if (last && /\.apk$/i.test(last)) fname = last;
          else if (fileNameHint) fname = fileNameHint.replace(/[^\w\-.]/g, '_') + '.apk';
        } catch (e) {
          if (fileNameHint) fname = fileNameHint.replace(/[^\w\-.]/g, '_') + '.apk';
        }
        a.download = fname;
        a.rel = 'noopener';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        // Method 2 (fallback): hidden iframe — triggers download without navigation
        // Only used if the anchor's download attribute is ignored (cross-origin servers)
        setTimeout(() => {
          try {
            const iframe = $('dlFrame');
            if (iframe) {
              iframe.src = url;
            }
          } catch (e) {}
        }, 300);

        toast('Download started!', 'ok');

        // Reset button after a moment
        setTimeout(() => {
          if (btn) {
            btn.classList.remove('loading');
            btn.innerHTML = originalHtml;
          }
        }, 2500);

      } catch (err) {
        console.error('Download error:', err);
        if (btn) {
          btn.classList.remove('loading');
          btn.innerHTML = originalHtml;
        }
        toast('Download failed. Try again.', 'err');
      }
    }

    /* ============================================
       RENDER APPS (with search filter)
    ============================================ */
    function computeFilteredIds() {
      const ids = Object.keys(appsCache);
      // Sort newest first
      ids.sort((a, b) => (appsCache[b].createdAt || 0) - (appsCache[a].createdAt || 0));

      if (!searchQuery.trim()) return ids;

      const q = searchQuery.trim().toLowerCase();
      return ids.filter(id => {
        const a = appsCache[id];
        if (!a) return false;
        const name = String(a.name || '').toLowerCase();
        const size = String(a.size || '').toLowerCase();
        const android = String(a.android || '').toLowerCase();
        const arch = String(a.arch || '').toLowerCase();
        return name.includes(q) || size.includes(q) || android.includes(q) || arch.includes(q);
      });
    }

    function renderApps(force = false) {
      const ids = computeFilteredIds();
      filteredIds = ids;

      // Update count
      const countEl = $('appCount');
      if (countEl) {
        const total = Object.keys(appsCache).length;
        countEl.textContent = searchQuery.trim() ? `${ids.length}/${total}` : `${total}`;
      }

      // Hash for change detection
      const hash = ids.map(id => id + '|' + (appsCache[id].updatedAt || appsCache[id].createdAt || 0)).join(';') + '||' + searchQuery;
      if (!force && hash === lastAppsHash) return;
      lastAppsHash = hash;

      const listEl = $('appList');

      if (!Object.keys(appsCache).length) {
        listEl.innerHTML = `
          <div class="empty-list">
            <i class="ti ti-package-off"></i>
            No apps available yet.<br>Check back soon.
          </div>
        `;
        return;
      }

      if (!ids.length) {
        listEl.innerHTML = `
          <div class="empty-list">
            <i class="ti ti-search-off"></i>
            No apps match "${escapeHtml(searchQuery)}".<br>Try a different search.
          </div>
        `;
        return;
      }

      const waLink = buildWaLink();

      let html = '';
      for (const id of ids) {
        const a = appsCache[id];
        const icon = a.iconUrl || 'https://files.catbox.moe/werqf8.png';
        const apkUrl = a.apkUrl || '';
        const needsPwd = !!(a.password && String(a.password).trim());
        const safeName = String(a.name || 'app').replace(/[^\w\-]/g, '_');

        const specs = [
          a.size ? `<span>${escapeHtml(a.size)}</span>` : '',
          a.android ? `<span>${escapeHtml(a.android)}</span>` : '',
          a.arch ? `<span class="hl">${escapeHtml(a.arch)}</span>` : '',
          needsPwd ? `<span class="lock"><i class="ti ti-lock" style="font-size:0.6rem;vertical-align:middle;"></i> LOCKED</span>` : ''
        ].filter(Boolean).join('');

        html += `
          <div class="app-card" data-app-id="${escapeHtml(id)}">
            <div class="app-top">
              <div class="app-icon-wrap">
                <img src="${escapeHtml(icon)}"
                     alt="${escapeHtml(a.name || 'App')}"
                     loading="lazy"
                     decoding="async"
                     onerror="this.src='https://files.catbox.moe/werqf8.png'">
              </div>
              <div class="app-meta">
                <div class="app-name">${escapeHtml(a.name || 'Untitled App')}</div>
                <div class="app-specs">${specs || '<span>APK</span>'}</div>
              </div>
              ${needsPwd
                ? `<button class="dl-btn" data-unlock="${escapeHtml(id)}"><i class="ti ti-lock"></i> GET</button>`
                : `<button class="dl-btn" data-dl="${escapeHtml(id)}" data-url="${escapeHtml(apkUrl)}" data-name="${escapeHtml(safeName)}"><i class="ti ti-download"></i> GET</button>`
              }
            </div>

            ${needsPwd ? `
            <div class="pwd-panel" data-panel="${escapeHtml(id)}">
              <div class="pwd-inner">
                <div class="pwd-label">
                  <i class="ti ti-shield-lock"></i>
                  Password required to download
                </div>

                <div class="pwd-input-row">
                  <div class="pwd-input-wrap">
                    <i class="ti ti-key"></i>
                    <input type="password"
                           placeholder="Enter password"
                           data-pwd-input="${escapeHtml(id)}"
                           autocomplete="off">
                  </div>
                  <button class="pwd-submit" data-pwd-submit="${escapeHtml(id)}">
                    <i class="ti ti-unlock"></i> UNLOCK
                  </button>
                </div>

                <div class="pwd-error" data-pwd-error="${escapeHtml(id)}">
                  <i class="ti ti-alert-circle"></i>
                  <span>Wrong password. Contact us on WhatsApp for help.</span>
                </div>

                <div class="pwd-success" data-pwd-success="${escapeHtml(id)}">
                  <i class="ti ti-circle-check"></i>
                  <span>Unlocked! Tap the green button below.</span>
                </div>

                <a class="pwd-help" href="${escapeHtml(waLink)}" target="_blank" rel="noopener noreferrer">
                  <span class="wa-icon"><i class="ti ti-brand-whatsapp"></i></span>
                  <div class="wa-text">
                    <div class="wa-title">Need Password?</div>
                    <div class="wa-sub">Contact us on WhatsApp to get the password</div>
                  </div>
                  <i class="ti ti-arrow-right wa-arrow"></i>
                </a>

                <button class="dl-unlocked"
                   data-unlocked-dl="${escapeHtml(id)}"
                   data-url="${escapeHtml(apkUrl)}"
                   data-name="${escapeHtml(safeName)}">
                  <i class="ti ti-download"></i> DOWNLOAD NOW
                </button>
              </div>
            </div>
            ` : ''}
          </div>
        `;
      }

      listEl.innerHTML = html;
      bindAppEvents(listEl);
    }

    /* ============================================
       EVENT DELEGATION
    ============================================ */
    function bindAppEvents(listEl) {
      if (listEl._bound) return;
      listEl._bound = true;

      listEl.addEventListener('click', (e) => {
        // Direct download (no password)
        const dl = e.target.closest('[data-dl]');
        if (dl) {
          const url = dl.getAttribute('data-url');
          const name = dl.getAttribute('data-name');
          const id = dl.getAttribute('data-dl');
          const a = appsCache[id];
          if (a && a.name) toast(`Downloading: ${a.name}`, 'ok');
          triggerDirectDownload(url, name, dl);
          return;
        }

        // Unlock button
        const unlockBtn = e.target.closest('[data-unlock]');
        if (unlockBtn) {
          const id = unlockBtn.getAttribute('data-unlock');
          const panel = listEl.querySelector(`[data-panel="${cssEscape(id)}"]`);
          if (panel) {
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
              const input = panel.querySelector(`[data-pwd-input="${cssEscape(id)}"]`);
              setTimeout(() => input && input.focus(), 320);
            }
          }
          return;
        }

        // Submit password
        const submit = e.target.closest('[data-pwd-submit]');
        if (submit) {
          const id = submit.getAttribute('data-pwd-submit');
          verifyPassword(id, listEl);
          return;
        }

        // Download after unlock
        const uDl = e.target.closest('[data-unlocked-dl]');
        if (uDl) {
          const url = uDl.getAttribute('data-url');
          const name = uDl.getAttribute('data-name');
          const id = uDl.getAttribute('data-unlocked-dl');
          const a = appsCache[id];
          if (a && a.name) toast(`Downloading: ${a.name}`, 'ok');
          triggerDirectDownload(url, name, uDl);
          return;
        }
      });

      listEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const input = e.target.closest('[data-pwd-input]');
          if (input) {
            const id = input.getAttribute('data-pwd-input');
            e.preventDefault();
            verifyPassword(id, listEl);
          }
        }
      });
    }

    function verifyPassword(id, listEl) {
      const a = appsCache[id];
      if (!a) return;

      const input = listEl.querySelector(`[data-pwd-input="${cssEscape(id)}"]`);
      const err = listEl.querySelector(`[data-pwd-error="${cssEscape(id)}"]`);
      const success = listEl.querySelector(`[data-pwd-success="${cssEscape(id)}"]`);
      const unlockBtn = listEl.querySelector(`[data-unlock="${cssEscape(id)}"]`);
      const unlockedDl = listEl.querySelector(`[data-unlocked-dl="${cssEscape(id)}"]`);
      const helpRow = listEl.querySelector(`[data-panel="${cssEscape(id)}"] .pwd-help`);

      if (!input) return;

      const entered = input.value.trim();
      const correct = String(a.password || '').trim();

      if (!entered) {
        showErr(err);
        return;
      }

      if (entered === correct) {
        if (err) err.classList.remove('show');
        if (success) success.classList.add('show');
        if (unlockedDl) unlockedDl.classList.add('show');
        if (helpRow) helpRow.style.display = 'none';

        input.disabled = true;
        input.style.opacity = '0.5';
        const submitBtn = listEl.querySelector(`[data-pwd-submit="${cssEscape(id)}"]`);
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.style.opacity = '0.5';
          submitBtn.innerHTML = '<i class="ti ti-check"></i> OK';
        }

        if (unlockBtn) {
          unlockBtn.style.background = 'linear-gradient(135deg, #34d399 0%, #059669 100%)';
          unlockBtn.style.borderColor = 'rgba(52,211,153,0.7)';
          unlockBtn.style.boxShadow = '0 0 24px rgba(52,211,153,0.4)';
          unlockBtn.innerHTML = '<i class="ti ti-lock-open"></i> READY';
          unlockBtn.disabled = true;
        }

        toast('Password correct! Download unlocked.', 'ok');
      } else {
        showErr(err);
        input.value = '';
        input.focus();
      }
    }

    function showErr(errEl) {
      if (!errEl) return;
      errEl.classList.remove('show');
      void errEl.offsetWidth;
      errEl.classList.add('show');
      setTimeout(() => errEl.classList.remove('show'), 4000);
    }

    function cssEscape(s) {
      return String(s).replace(/["\\]/g, '\\$&');
    }

    /* ============================================
       SEARCH
    ============================================ */
    let searchTimer;
    const searchInput = $('searchInput');
    const searchClear = $('searchClear');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      searchClear.classList.toggle('show', !!searchQuery);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => renderApps(true), 120);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClear.classList.remove('show');
      renderApps(true);
      searchInput.focus();
    });

    /* ============================================
       AD + PROFILE RENDER
    ============================================ */
    function renderAd(cfg) {
      const hash = JSON.stringify(cfg || null);
      if (hash === lastAdHash) return;
      lastAdHash = hash;

      const card = $('adCard');
      const link = $('adLink');
      const img = $('adImage');
      const title = $('adTitle');
      const desc = $('adDesc');

      if (!cfg || !cfg.active || !cfg.url) {
        card.style.display = 'none';
        return;
      }

      card.style.display = 'block';
      link.href = cfg.url;
      title.textContent = cfg.title || 'Sponsored';
      desc.textContent = cfg.desc || 'Tap to learn more';

      if (cfg.image) {
        img.src = cfg.image;
        img.style.display = '';
      } else {
        img.style.display = 'none';
      }
    }

    function renderProfile(cfg) {
      const hash = JSON.stringify(cfg || null);
      if (hash === lastProfileHash) return;
      lastProfileHash = hash;

      cfg = cfg || {};

      if (cfg.logoUrl) {
        const av = $('profileAvatar');
        if (av) av.src = cfg.logoUrl;
      }

      if (cfg.appName) {
        const n = $('profileName');
        if (n) n.textContent = cfg.appName;
      }

      if (cfg.bio) {
        const b = $('profileBio');
        if (b) b.textContent = cfg.bio;
      }

      let handle = 'HackingBotBd';
      let tgUrl = 'https://t.me/HackingBotBd';
      if (cfg.telegram) {
        tgUrl = cfg.telegram;
        handle = String(cfg.telegram).split('/').pop().replace(/^@/, '');
      } else if (cfg.username) {
        handle = String(cfg.username).replace(/^@/, '');
        tgUrl = 'https://t.me/' + handle;
      }

      const tgBtn = $('tgBtn');
      if (tgBtn) tgBtn.href = tgUrl;

      const u = $('profileUsername');
      if (u) u.innerHTML = `<i class="ti ti-brand-telegram"></i>@${escapeHtml(handle)}`;
    }

    /* ============================================
       FIREBASE BOOT
    ============================================ */
    function boot() {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();

        db.ref('apps').on('value', (snap) => {
          appsCache = snap.val() || {};
          renderApps(true);
        }, (err) => {
          console.warn('apps read error:', err);
          $('appList').innerHTML = `
            <div class="empty-list">
              <i class="ti ti-wifi-off"></i>
              Could not load apps.<br>Check connection.
            </div>
          `;
        });

        db.ref('ad_config').on('value', (snap) => {
          renderAd(snap.val());
        }, (err) => console.warn('ad_config read error:', err));

        db.ref('app_config').on('value', (snap) => {
          appConfigCache = snap.val() || {};
          renderProfile(appConfigCache);
        }, (err) => console.warn('app_config read error:', err));

        console.log('[User App] Firebase connected');
      } catch (err) {
        console.error('[User App] Firebase init failed:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
